[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decorating-lrnn"
version = "0.1.0"
description = "Autonomous linear recurrent neural networks with spectral dimension reduction."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "references/octave/LICENSE"]
authors = [{name = "Oliver Obst"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8"]
audit = ["mpmath>=1.3"]
dev = ["matplotlib>=3.8", "pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lrnn = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["scientific: end-to-end scientific regression cases"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
